server:
  port: 8080

spring:
  application:
    name: mcp-webflux-block
  threads:
    virtual:
      enabled: false
  ai:
    mcp:
      server:
        name: mcp-webflux-block
        version: 1.0.0
        type: SYNC
        protocol: ${MCP_PROTOCOL:STATELESS}
        streamable-http:
          keep-alive-interval: 30s
        capabilities:
          tool: true

backend:
  base-url: ${BACKEND_BASE_URL:http://localhost:8089}
  max-connections: 1000
  timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.example.poc: ${TOOL_LOG_LEVEL:INFO}
