name: poc-virtual-threads

x-app-limits: &app-limits
  deploy:
    resources:
      limits:
        cpus: "2"
        memory: 1G

x-app-healthcheck: &app-healthcheck
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 10s

services:
  wiremock:
    image: wiremock/wiremock:3.13.1
    command:
      - --port=8080
      - --global-response-templating
      - --async-response-enabled=true
      - --async-response-threads=200
      - --container-threads=1000
      - --no-request-journal
      - --disable-request-logging
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
    ports:
      - "8089:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  mcp-webflux-block:
    build:
      context: .
      args:
        MODULE: mcp-webflux-block
    image: poc/mcp-webflux-block:1.0.0
    environment:
      BACKEND_BASE_URL: http://wiremock:8080
      TOOL_LOG_LEVEL: ${TOOL_LOG_LEVEL:-INFO}
      MCP_PROTOCOL: ${MCP_PROTOCOL:-STATELESS}
    ports:
      - "8081:8080"
    depends_on:
      wiremock:
        condition: service_healthy
    <<: [*app-limits, *app-healthcheck]

  mcp-mvc-vt:
    build:
      context: .
      args:
        MODULE: mcp-mvc-vt
    image: poc/mcp-mvc-vt:1.0.0
    environment:
      BACKEND_BASE_URL: http://wiremock:8080
      TOOL_LOG_LEVEL: ${TOOL_LOG_LEVEL:-INFO}
      MCP_PROTOCOL: ${MCP_PROTOCOL:-STATELESS}
    ports:
      - "8082:8080"
    depends_on:
      wiremock:
        condition: service_healthy
    <<: [*app-limits, *app-healthcheck]

  # Load generator; only started on demand: docker compose run --rm k6 ...
  k6:
    image: grafana/k6:1.3.0
    profiles: ["loadtest"]
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
    working_dir: /scripts
